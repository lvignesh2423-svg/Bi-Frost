services:
  bi-frost:
    build:
      context: .
      dockerfile: Dockerfile
    image: bi-frost:latest
    container_name: bi-frost
    ports:
      - "8001:8001"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/skill_gap_analyzer.db}
      - LLM_MODEL=${LLM_MODEL:-meta-llama/llama-3.1-70b-instruct}
      - JWT_SECRET=${JWT_SECRET:-skillgap-ai-secret-key-change-in-production-2024}
    volumes:
      # Persistent SQLite storage (survives container recreation)
      - bi-frost-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  bi-frost-data:
