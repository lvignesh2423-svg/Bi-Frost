version: '3.8'

services:
  bi-frost:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./skill_gap_analyzer.db}
      - LLM_MODEL=${LLM_MODEL:-meta-llama/llama-3.1-70b-instruct}
    volumes:
      - ./backend:/app/backend
      - ./frontend/dist:/app/frontend/dist
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
